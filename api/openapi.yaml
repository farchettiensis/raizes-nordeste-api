openapi: 3.0.3

info:
  title: API Raizes do Nordeste
  version: 0.1.0
  description: |
    API REST da rede de lanchonetes Raizes do Nordeste.

    Projeto Multidisciplinar 2026, trilha Back-End (UNINTER).

    Todas as falhas respondem com o mesmo corpo padronizado, descrito no
    schema `Erro`.

servers:
  - url: /
    description: Servidor que esta atendendo esta documentacao

tags:
  - name: Autenticacao
    description: Cadastro, login e logout
  - name: Conta
    description: Dados da conta autenticada
  - name: Unidades
    description: Unidades da rede, o cardápio e o estoque de cada uma
  - name: Pedidos
    description: Criacao de pedidos, com validacao de cardapio e estoque da unidade
  - name: Pagamentos
    description: |
      Pagamento por um provedor externo (simulado pelo servico pagamento-mock).
      A API solicita o pagamento e recebe o resultado depois, por webhook.
  - name: Fidelidade
    description: |
      Programa de pontos do cliente, com adesao por consentimento explicito.
      Pontos sao ganhos na entrega do pedido e resgatados como desconto na
      criacao de um novo pedido.
  - name: Auditoria
    description: Trilha das acoes sensiveis, para a matriz

security:
  - bearerAuth: []

paths:
  /api/v1/auth/signup:
    post:
      tags: [Autenticacao]
      summary: Cria uma conta e devolve um token de acesso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaConta'
            example:
              fullName: Dona Francisca
              email: francisca@raizes.test
              password: Senha@123
              passwordConfirmation: Senha@123
              consentimentoDados: true
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaAutenticacao'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/auth/login:
    post:
      tags: [Autenticacao]
      summary: Autentica o usuario e devolve um token de acesso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
            example:
              email: francisca@raizes.test
              password: Senha@123
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaAutenticacao'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/clientes/conta:
    delete:
      tags: [Conta]
      summary: Encerra e anonimiza o cadastro do proprio cliente
      description: |
        Exclusivo para CLIENTE. Confirma a senha atual, remove identificadores do cadastro,
        revoga todos os tokens e consentimentos e expira o saldo de fidelidade.
        Remove observacoes dos pedidos e IP/requestId da auditoria vinculada ao cliente.
        Pedidos, pagamentos e movimentos permanecem com os identificadores internos.
        Essa preservacao limita a anonimizacao a remocao dos identificadores diretos.
        A operacao e irreversivel e nao encerra contas de equipe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
            example:
              password: Senha@123
      responses:
        '204':
          description: Conta encerrada e tokens revogados
        '401':
          $ref: '#/components/responses/ConfirmacaoDeContaInvalida'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/account/profile:
    get:
      tags: [Conta]
      summary: Devolve os dados da conta autenticada
      responses:
        '200':
          description: Dados da conta
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/account/logout:
    post:
      tags: [Conta]
      summary: Revoga o token de acesso em uso
      responses:
        '200':
          description: Token revogado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/unidades:
    get:
      tags: [Unidades]
      summary: Lista as unidades da rede
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: estado
          in: query
          description: Sigla da unidade federativa, com duas letras
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: PE
        - name: cidade
          in: query
          description: Trecho do nome da cidade, sem diferenciar maiúsculas
          schema:
            type: string
            example: Recife
        - name: ativa
          in: query
          description: Filtra por unidades ativas ou inativas. Sem o parâmetro, devolve todas
          schema:
            type: boolean
      responses:
        '200':
          description: Lista paginada de unidades
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Unidade'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/unidades/{id}:
    get:
      tags: [Unidades]
      summary: Devolve uma unidade da rede
      security: []
      parameters:
        - $ref: '#/components/parameters/UnidadeId'
      responses:
        '200':
          description: Dados da unidade
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Unidade'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'

  /api/v1/unidades/{id}/cardapio:
    get:
      tags: [Unidades]
      summary: Lista o cardápio de uma unidade
      description: |
        Devolve os produtos ofertados pela unidade, com o preço praticado ali.

        O campo `disponivel` combina três condições: o item estar liberado no
        cardápio da unidade, o produto estar ativo na rede e haver saldo em
        estoque naquela unidade. Um item indisponível continua aparecendo na
        listagem, para que o cliente saiba que ele existe.
      security: []
      parameters:
        - $ref: '#/components/parameters/UnidadeId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cardápio paginado, ordenado pelo nome do produto
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemDoCardapio'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/unidades/{id}/estoque:
    get:
      tags: [Unidades]
      summary: Lista o saldo de estoque de uma unidade
      description: |
        Devolve a posicao de estoque da unidade, produto a produto, com a
        quantidade em maos e a quantidade minima definida para reposicao.

        Endpoint restrito a equipe da operacao: ATENDENTE, COZINHA, GERENTE e
        ADMIN. Um CLIENTE autenticado recebe 403, porque a disponibilidade que
        interessa a ele ja aparece no cardapio publico da unidade.

        ATENDENTE, COZINHA e GERENTE so consultam a unidade a que estao
        vinculados (outra unidade e 403 SEM_PERMISSAO; sem unidade vinculada,
        403 SEM_UNIDADE_VINCULADA). ADMIN consulta qualquer unidade.
        Um id que nao seja inteiro de 1 a 2147483647 responde 422 DADOS_INVALIDOS.
      parameters:
        - $ref: '#/components/parameters/UnidadeEstoqueId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saldo paginado, ordenado pelo nome do produto
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaldoDeEstoque'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/unidades/{id}/estoque/movimentacoes:
    post:
      tags: [Unidades]
      summary: Registra uma entrada ou um ajuste de estoque
      description: |
        GERENTE opera somente a propria unidade; ADMIN opera qualquer unidade.
        Um gerente sem vinculo recebe 403 SEM_UNIDADE_VINCULADA.
        Um id que nao seja inteiro de 1 a 2147483647 responde 422 DADOS_INVALIDOS.
        Exige um estoque ja cadastrado para o produto naquela unidade (404
        se a unidade ou o registro de estoque nao existir).

        ENTRADA soma uma quantidade positiva. AJUSTE soma uma diferenca
        positiva ou negativa, nunca zero. Exemplo: saldo 10 e ajuste -3
        resultam em saldo 7. SAIDA e reservada aos pedidos.
        O motivo e obrigatorio. Saldo negativo responde 409
        ESTOQUE_INSUFICIENTE. O saldo resultante somado as unidades reservadas
        em pedidos AGUARDANDO_PAGAMENTO ou PAGO nao pode superar 2147483647;
        acima disso responde 409 SALDO_ESTOQUE_ACIMA_DO_LIMITE, preservando
        espaco para devolucoes por cancelamento ou recusa de pagamento.
        As reservas sao somadas apos obter a trava do estoque.
        Saldo, movimentacao e auditoria
        estoque.movimentado sao gravados na mesma transacao, com trava
        do registro de estoque para serializar pedidos e lancamentos.
        Cada chamada valida gera um novo movimento; nao ha idempotencia.
      parameters:
        - $ref: '#/components/parameters/UnidadeEstoqueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaMovimentacaoEstoque'
            examples:
              entrada:
                value: { produtoId: 1, tipo: ENTRADA, quantidade: 20, motivo: Reposicao semanal }
              ajuste:
                value:
                  { produtoId: 1, tipo: AJUSTE, quantidade: -2, motivo: Perda no armazenamento }
      responses:
        '201':
          description: Movimentacao registrada com o saldo resultante
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MovimentacaoEstoque'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '409':
          $ref: '#/components/responses/EstoqueEmConflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/pedidos:
    get:
      tags: [Pedidos]
      summary: Lista pedidos, com filtros por canal, status e unidade
      description: |
        Lista paginada dos pedidos dentro do escopo do usuario: o CLIENTE ve
        os proprios pedidos; ATENDENTE, COZINHA e GERENTE, os da unidade a que
        estao vinculados; ADMIN, todos. Um perfil de unidade sem unidade
        vinculada recebe 403 SEM_UNIDADE_VINCULADA.

        Os filtros se combinam, por exemplo
        `?canalPedido=APP&status=AGUARDANDO_PAGAMENTO`. O filtro `unidadeId`
        vale para ADMIN e CLIENTE; para um perfil de unidade, so a propria
        unidade e aceita, e outra responde 403.

        Ordem: mais recentes primeiro, com desempate pelo id.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: canalPedido
          in: query
          schema:
            type: string
            enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
        - name: status
          in: query
          schema:
            type: string
            enum: [AGUARDANDO_PAGAMENTO, PAGO, EM_PREPARO, PRONTO, ENTREGUE, CANCELADO]
        - name: unidadeId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Pedidos paginados, com itens e pagamento
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pedido'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ForaDoEscopoDaListagem'
        '422':
          $ref: '#/components/responses/DadosInvalidos'
    post:
      tags: [Pedidos]
      summary: Cria um pedido validando o cardapio e o estoque da unidade
      description: |
        Cria o pedido em AGUARDANDO_PAGAMENTO para o CLIENTE autenticado. O
        cliente vem do token, nunca do corpo da requisicao.

        Cada item guarda o nome e o preco praticado na unidade no momento do
        pedido, e o total e calculado no servidor. O estoque e baixado na
        criacao, com uma movimentacao de SAIDA por item vinculada ao pedido.

        Os saldos dos produtos do pedido ficam bloqueados (SELECT ... FOR
        UPDATE) durante a transacao, entao dois pedidos simultaneos pela ultima
        unidade de um produto nunca sao aceitos ao mesmo tempo: um e criado e
        o outro recebe 409.

        As verificacoes seguem esta ordem e cada uma aponta todos os itens com
        problema: unidade inexistente (404) ou inativa (409), produto fora do
        cardapio da unidade (404), produto indisponivel (409) e estoque
        insuficiente (409).

        Com `pontosResgatados`, o cliente troca pontos de fidelidade por
        desconto (R$ 0,05 por ponto, ate 50% do subtotal). Depois do estoque,
        a API confere a adesao ao programa (409 FIDELIDADE_INATIVA), o saldo
        (409 SALDO_DE_PONTOS_INSUFICIENTE) e o limite (409
        DESCONTO_ACIMA_DO_LIMITE). Os pontos saem do saldo na criacao, com a
        conta bloqueada, e voltam se o pedido for cancelado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPedido'
            example:
              unidadeId: 1
              canalPedido: TOTEM
              itens:
                - produtoId: 1
                  quantidade: 2
                - produtoId: 5
                  quantidade: 1
      responses:
        '201':
          description: Pedido criado, aguardando pagamento
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/PedidoComRecursoInexistente'
        '409':
          $ref: '#/components/responses/PedidoEmConflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Consulta um pedido, com os itens e o pagamento
      description: |
        Devolve o pedido com os itens e o pagamento, se houver. E por aqui que o
        cliente acompanha o resultado do pagamento, que chega de forma
        assincrona: o pedido sai de AGUARDANDO_PAGAMENTO para PAGO ou
        CANCELADO quando o provedor responde.

        Qualquer perfil autenticado, dentro do seu escopo: o CLIENTE ve os
        proprios pedidos; ATENDENTE, COZINHA e GERENTE, os da unidade a que
        estao vinculados; ADMIN, todos. Fora do escopo a resposta e 403, e um
        perfil de unidade sem unidade vinculada recebe 403
        SEM_UNIDADE_VINCULADA. A existencia e conferida antes (404).
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/ForaDoEscopoDoPedido'
        '404':
          $ref: '#/components/responses/PedidoNaoEncontrado'

  /api/v1/pedidos/{id}/status:
    patch:
      tags: [Pedidos]
      summary: Avanca o pedido no ciclo de vida ou cancela o pedido
      description: |
        Leva o pedido ao proximo status ou o cancela. Cada transicao tem os
        perfis que podem faze-la:

        | Transicao | Perfis |
        |---|---|
        | PAGO para EM_PREPARO | COZINHA, GERENTE |
        | EM_PREPARO para PRONTO | COZINHA, GERENTE |
        | PRONTO para ENTREGUE | ATENDENTE, GERENTE |
        | AGUARDANDO_PAGAMENTO para CANCELADO | CLIENTE dono, ATENDENTE, GERENTE, ADMIN |
        | PAGO, EM_PREPARO ou PRONTO para CANCELADO | GERENTE, ADMIN |

        ATENDENTE, COZINHA e GERENTE so agem sobre pedidos da propria
        unidade, e o CLIENTE so sobre os proprios. ADMIN cancela, mas nao faz
        transicoes de avanco, porque a matriz nao opera a cozinha nem o
        balcao. PAGO nao e aceito: so o webhook do provedor marca o pedido
        como pago.

        As checagens rodam com o pedido travado, nesta ordem: existencia
        (404), escopo (403), transicao prevista no ciclo de vida (409, com os
        destinos possiveis a partir do status atual) e perfil (403). Duas
        transicoes simultaneas do mesmo pedido nunca sao aplicadas juntas: a
        segunda espera a primeira e recebe 409. Nao ha volta de status.

        Cancelar exige `motivo` e segue estas regras:

        - Pagamento PENDENTE: 409 `PAGAMENTO_EM_ANDAMENTO`. Uma aprovacao que
          chegasse depois do cancelamento deixaria uma cobranca sem estorno.
        - Pagamento APROVADO: a API pede o estorno ao provedor antes de
          cancelar. Se o provedor falhar (502 ou 503), o pedido nao muda, e
          repetir a chamada reenvia o estorno com a mesma chave de
          idempotencia, sem estornar duas vezes.
        - O estoque volta (uma ENTRADA por item) so quando o pedido e
          cancelado de AGUARDANDO_PAGAMENTO ou PAGO. De EM_PREPARO ou PRONTO
          os insumos ja foram usados: ha estorno, mas o estoque nao volta.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizacaoDeStatus'
            examples:
              avanco:
                value:
                  status: EM_PREPARO
              cancelamento:
                value:
                  status: CANCELADO
                  motivo: Cliente desistiu no balcao
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissaoNaTransicao'
        '404':
          $ref: '#/components/responses/PedidoNaoEncontrado'
        '409':
          $ref: '#/components/responses/TransicaoDeStatusInvalida'
        '422':
          $ref: '#/components/responses/DadosInvalidos'
        '502':
          $ref: '#/components/responses/GatewayPagamentoErro'
        '503':
          $ref: '#/components/responses/EstornoIndisponivel'

  /api/v1/pedidos/{id}/pagamento:
    post:
      tags: [Pagamentos]
      summary: Solicita o pagamento de um pedido ao provedor externo
      description: |
        Envia o pedido ao provedor de pagamento e devolve o pagamento como
        PENDENTE, com 202: o resultado chega depois, pelo webhook do provedor,
        e e entao que o pedido vai para PAGO ou CANCELADO. Para PIX, a resposta
        traz o codigo copia e cola que o cliente usa no app do banco.

        So o CLIENTE dono do pedido pode paga-lo, e so enquanto o pedido esta
        AGUARDANDO_PAGAMENTO. O valor vem do total do pedido, nunca do corpo.
        A API nao recebe dados de cartao: a captura e feita pelo app cliente
        direto no provedor.

        Idempotente por pedido: repetir a chamada com o mesmo metodo devolve o
        mesmo pagamento, sem cobrar de novo. Se o provedor nao respondeu (503),
        repetir a chamada reenvia a mesma solicitacao com a mesma chave de
        idempotencia. Trocar o metodo com um pagamento em andamento e 409.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPagamento'
            example:
              metodo: PIX
      responses:
        '202':
          description: Pagamento solicitado, aguardando o resultado do provedor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Pagamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissaoNoPedido'
        '404':
          $ref: '#/components/responses/PedidoNaoEncontrado'
        '409':
          $ref: '#/components/responses/PagamentoEmConflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'
        '502':
          $ref: '#/components/responses/GatewayPagamentoErro'
        '503':
          $ref: '#/components/responses/GatewayPagamentoIndisponivel'

  /api/v1/fidelidade:
    get:
      tags: [Fidelidade]
      summary: Situacao do cliente no programa de fidelidade
      description: |
        Exclusivo do CLIENTE. Responde 200 mesmo sem adesao, com `ativa:
        false`, para o app mostrar o convite. Traz as regras vigentes: pontos
        por real, valor do ponto e limite de desconto.
      responses:
        '200':
          description: Situacao no programa
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProgramaDeFidelidade'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /api/v1/fidelidade/movimentos:
    get:
      tags: [Fidelidade]
      summary: Extrato de pontos do cliente
      description: |
        Exclusivo do CLIENTE. Movimentos paginados da propria conta, mais
        recentes primeiro: ACUMULO na entrega, RESGATE na criacao do pedido,
        ESTORNO quando um pedido com resgate e cancelado e EXPIRACAO quando o
        consentimento e revogado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Movimentos paginados
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MovimentoDeFidelidade'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/fidelidade/adesao:
    post:
      tags: [Fidelidade]
      summary: Adere ao programa com consentimento explicito
      description: |
        Exclusivo do CLIENTE. O corpo precisa trazer `consentimento: true`:
        a adesao e o consentimento para o tratamento dos dados de consumo
        com a finalidade de fidelizacao (LGPD, art. 7, I). Grava a data do
        consentimento no usuario, abre a conta (ou reabre, com saldo zero) e
        registra `fidelidade.aderida` na auditoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consentimento]
              properties:
                consentimento:
                  type: boolean
                  enum: [true]
            example:
              consentimento: true
      responses:
        '201':
          description: Adesao registrada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProgramaDeFidelidade'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/FidelidadeEmConflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'
    delete:
      tags: [Fidelidade]
      summary: Revoga o consentimento e sai do programa
      description: |
        Exclusivo do CLIENTE. A revogacao vale a qualquer momento (LGPD, art.
        8, paragrafo 5). Limpa a data do consentimento, zera o saldo com um
        movimento de EXPIRACAO e registra `fidelidade.revogada` na auditoria.
        A conta e o extrato ficam, porque sustentam os descontos ja
        concedidos; a partir daqui nada mais e acumulado nem resgatado.
      responses:
        '204':
          description: Consentimento revogado
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/FidelidadeEmConflito'

  /api/v1/auditoria:
    get:
      tags: [Auditoria]
      summary: Consulta a trilha de auditoria das acoes sensiveis
      description: |
        Exclusivo do ADMIN. Lista paginada dos registros de auditoria, mais
        recentes primeiro. Cada acao sensivel grava um registro na mesma
        transacao da acao: criacao, mudanca de status e cancelamento de
        pedido; solicitacao, resultado e estorno de pagamento; cadastro,
        login, tentativa de login negada e logout; adesao e revogacao do
        consentimento de fidelidade; movimentacao manual de estoque. Todo 403 da API tambem
        grava um registro `acesso.negado`, inclusive a tentativa de abrir
        esta rota sem ser ADMIN.

        Os registros nao guardam nome, e-mail, senha nem token: so
        identificadores, status, valores e motivos.

        Para ver o historico de um pedido: `?entidade=pedido&entidadeId=9001`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: acao
          in: query
          schema:
            type: string
            enum:
              [
                usuario.cadastrado,
                usuario.anonimizado,
                auth.login,
                auth.login_negado,
                auth.logout,
                pedido.criado,
                pedido.status_alterado,
                pedido.cancelado,
                pagamento.solicitado,
                pagamento.aprovado,
                pagamento.recusado,
                pagamento.estornado,
                fidelidade.aderida,
                fidelidade.revogada,
                estoque.movimentado,
                acesso.negado,
              ]
        - name: entidade
          in: query
          schema:
            type: string
            enum: [user, pedido, pagamento, fidelidade, estoque, rota]
        - name: entidadeId
          in: query
          schema:
            type: string
            maxLength: 40
        - name: usuarioId
          in: query
          description: Quem fez a acao
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Registros paginados
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistroDeAuditoria'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/pagamentos/webhook:
    post:
      tags: [Pagamentos]
      summary: Recebe do provedor o resultado de um pagamento
      description: |
        Chamado pelo provedor de pagamento, nao pelo cliente. Nao usa token: a
        autenticidade vem do cabecalho X-Assinatura, um HMAC-SHA256 de
        `<t>.<corpo bruto>` com o segredo compartilhado
        (PAGAMENTO_WEBHOOK_SECRET). Assinaturas com mais de 5 minutos sao
        recusadas, o que impede reaproveitar uma entrega capturada.

        APROVADO leva o pedido a PAGO. RECUSADO leva o pedido a CANCELADO,
        guarda o motivo no pagamento e devolve o estoque, com uma movimentacao
        de ENTRADA por item vinculada ao pedido, tudo na mesma transacao.

        O provedor entrega cada evento ao menos uma vez, entao o processamento
        e idempotente: o pedido e o pagamento ficam bloqueados durante a
        transacao e um resultado para pagamento que ja nao esta PENDENTE e
        ignorado com 204, sem devolver o estoque de novo.
      security: []
      parameters:
        - name: X-Assinatura
          in: header
          required: true
          description: '`t=<unix>,v1=<hmac em hexadecimal>`'
          schema:
            type: string
            example: t=1791140234,v1=88cf2b0e4d5a6f7c8b9a0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a
        - name: X-Evento-Id
          in: header
          required: false
          description: Identificador do evento, igual em todas as entregas dele
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoDePagamento'
      responses:
        '204':
          description: Resultado processado, ou entrega repetida ignorada
        '401':
          $ref: '#/components/responses/AssinaturaInvalida'
        '404':
          $ref: '#/components/responses/PagamentoNaoEncontrado'
        '409':
          $ref: '#/components/responses/ResultadoDePagamentoEmConflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

components:
  parameters:
    Page:
      name: page
      in: query
      description: Página desejada, começando em 1
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Quantidade de itens por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    UnidadeId:
      name: id
      in: path
      required: true
      description: Identificador da unidade
      schema:
        type: integer
        example: 1
    UnidadeEstoqueId:
      name: id
      in: path
      required: true
      description: Identificador da unidade; formato ou faixa invalida responde 422
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
        example: 1
    PedidoId:
      name: id
      in: path
      required: true
      description: Identificador do pedido
      schema:
        type: integer
        example: 9001

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de acesso devolvido por signup ou login

  schemas:
    RegistroDeAuditoria:
      type: object
      required: [logId, acao, entidade, entidadeId, usuarioId, dados, ip, requestId, createdAt]
      properties:
        logId:
          type: integer
          example: 512
        acao:
          type: string
          enum:
            [
              usuario.cadastrado,
              usuario.anonimizado,
              auth.login,
              auth.login_negado,
              auth.logout,
              pedido.criado,
              pedido.status_alterado,
              pedido.cancelado,
              pagamento.solicitado,
              pagamento.aprovado,
              pagamento.recusado,
              pagamento.estornado,
              fidelidade.aderida,
              fidelidade.revogada,
              estoque.movimentado,
              acesso.negado,
            ]
          example: pedido.cancelado
        entidade:
          type: string
          enum: [user, pedido, pagamento, fidelidade, estoque, rota]
          example: pedido
        entidadeId:
          type: string
          nullable: true
          example: '9001'
        usuarioId:
          type: integer
          nullable: true
          description: Quem fez a acao; nulo quando foi o provedor de pagamento ou um login sem conta
          example: 7
        dados:
          type: object
          nullable: true
          description: Detalhes da acao, sem dados pessoais
          example:
            de: PAGO
            motivo: Cliente desistiu no balcao
            estornado: true
            estoqueDevolvido: true
        ip:
          type: string
          nullable: true
          example: 203.0.113.10
        requestId:
          type: string
          nullable: true
          description: Mesmo valor do cabecalho X-Request-Id e do requestId nos erros
          example: 4d5e6f7a-8b9c-4d0e-9f2a-3b4c5d6e7f8a
        createdAt:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'

    NovaMovimentacaoEstoque:
      type: object
      required: [produtoId, tipo, quantidade, motivo]
      properties:
        produtoId:
          type: integer
          minimum: 1
          maximum: 2147483647
        tipo:
          type: string
          enum: [ENTRADA, AJUSTE]
        quantidade:
          type: integer
          minimum: -2147483647
          maximum: 2147483647
          not: { enum: [0] }
          description: Positiva para ENTRADA; diferenca com sinal para AJUSTE
        motivo:
          type: string
          minLength: 3
          maxLength: 255
          description: Justificativa apos remover espacos nas extremidades
      oneOf:
        - properties:
            tipo: { enum: [ENTRADA] }
            quantidade: { minimum: 1 }
        - properties:
            tipo: { enum: [AJUSTE] }

    MovimentacaoEstoque:
      type: object
      required:
        [movimentoId, estoqueId, usuarioId, tipo, quantidade, saldoResultante, motivo, createdAt]
      properties:
        movimentoId:
          type: integer
        estoqueId:
          type: integer
        usuarioId:
          type: integer
        tipo:
          type: string
          enum: [ENTRADA, AJUSTE]
        quantidade:
          type: integer
          description: Diferenca aplicada ao saldo anterior
        saldoResultante:
          type: integer
          minimum: 0
          maximum: 2147483647
        motivo:
          type: string
        createdAt:
          type: string
          format: date-time

    PaginationMetadata:
      type: object
      required: [total, perPage, currentPage, lastPage]
      properties:
        total:
          type: integer
          example: 4
        perPage:
          type: integer
          example: 10
        currentPage:
          type: integer
          example: 1
        lastPage:
          type: integer
          example: 1
        firstPage:
          type: integer
          example: 1
        firstPageUrl:
          type: string
          example: /?page=1
        lastPageUrl:
          type: string
          example: /?page=1
        nextPageUrl:
          type: string
          nullable: true
        previousPageUrl:
          type: string
          nullable: true

    Unidade:
      type: object
      required: [id, codigo, nome, formato, cidade, estado, endereco, ativa]
      properties:
        id:
          type: integer
          example: 1
        codigo:
          type: string
          example: REC001
        nome:
          type: string
          example: Raízes Boa Viagem
        formato:
          type: string
          enum: [COMPLETA, REDUZIDA]
          description: COMPLETA para cozinha completa, REDUZIDA para o formato enxuto
        cidade:
          type: string
          example: Recife
        estado:
          type: string
          example: PE
        endereco:
          type: string
          example: Av. Boa Viagem, 1200
        telefone:
          type: string
          nullable: true
          example: '8133334444'
        ativa:
          type: boolean
          example: true

    ItemDoCardapio:
      type: object
      required: [produtoId, codigo, nome, categoria, sazonal, preco, disponivel]
      properties:
        produtoId:
          type: integer
          example: 1
        codigo:
          type: string
          example: TAP001
        nome:
          type: string
          example: Tapioca de carne de sol com queijo coalho
        descricao:
          type: string
          nullable: true
        categoria:
          type: string
          example: TAPIOCA
        sazonal:
          type: boolean
          description: Produto ofertado apenas em determinada época do ano
          example: false
        preco:
          type: string
          description: Preço praticado nesta unidade, em reais
          example: '22.00'
        disponivel:
          type: boolean
          description: Liberado no cardápio, produto ativo e com saldo em estoque
          example: true

    SaldoDeEstoque:
      type: object
      required: [produtoId, codigo, nome, categoria, quantidade, quantidadeMinima, abaixoDoMinimo]
      properties:
        produtoId:
          type: integer
          example: 1
        codigo:
          type: string
          example: CUS001
        nome:
          type: string
          example: Cuscuz recheado de frango com catupiry
        categoria:
          type: string
          example: CUSCUZ
        quantidade:
          type: integer
          description: Saldo atual na unidade
          example: 12
        quantidadeMinima:
          type: integer
          description: Saldo a partir do qual a unidade precisa repor
          example: 2
        abaixoDoMinimo:
          type: boolean
          description: Verdadeiro quando o saldo atingiu ou passou do minimo
          example: false

    NovoPedido:
      type: object
      required: [unidadeId, canalPedido, itens]
      properties:
        unidadeId:
          type: integer
          example: 1
        canalPedido:
          type: string
          enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
          description: Canal por onde o pedido entrou
          example: TOTEM
        itens:
          type: array
          minItems: 1
          description: Cada produto aparece uma unica vez
          items:
            type: object
            required: [produtoId, quantidade]
            properties:
              produtoId:
                type: integer
                example: 1
              quantidade:
                type: integer
                minimum: 1
                maximum: 99
                example: 2
        observacoes:
          type: string
          maxLength: 500
          example: Sem cebola
        pontosResgatados:
          type: integer
          minimum: 1
          description: Pontos de fidelidade trocados por desconto neste pedido
          example: 100

    ItemDoPedido:
      type: object
      required: [produtoId, nome, quantidade, precoUnitario, subtotal]
      properties:
        produtoId:
          type: integer
          example: 1
        nome:
          type: string
          description: Nome do produto no momento do pedido
          example: Tapioca de carne de sol com queijo coalho
        quantidade:
          type: integer
          example: 2
        precoUnitario:
          type: string
          description: Preco praticado na unidade no momento do pedido
          example: '18.90'
        subtotal:
          type: string
          example: '37.80'

    Pedido:
      type: object
      required:
        [
          pedidoId,
          codigo,
          unidadeId,
          canalPedido,
          status,
          subtotal,
          desconto,
          total,
          pontosGerados,
          itens,
          canceladoEm,
          motivoCancelamento,
          createdAt,
        ]
      properties:
        pedidoId:
          type: integer
          example: 9001
        codigo:
          type: string
          example: PED260205A1B2C3D4
        unidadeId:
          type: integer
          example: 1
        canalPedido:
          type: string
          enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
          example: TOTEM
        status:
          type: string
          enum: [AGUARDANDO_PAGAMENTO, PAGO, EM_PREPARO, PRONTO, ENTREGUE, CANCELADO]
          example: AGUARDANDO_PAGAMENTO
        subtotal:
          type: string
          example: '60.15'
        desconto:
          type: string
          example: '0.00'
        total:
          type: string
          example: '60.15'
        pontosGerados:
          type: integer
          description: Pontos de fidelidade creditados na entrega; zero ate la ou sem adesao
          example: 0
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemDoPedido'
        pagamento:
          description: Presente na consulta do pedido; nulo enquanto nao houver pagamento
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Pagamento'
        canceladoEm:
          type: string
          format: date-time
          nullable: true
          description: Quando o pedido foi cancelado; nulo enquanto nao for
          example: null
        motivoCancelamento:
          type: string
          nullable: true
          description: Informado por quem cancelou; nulo na recusa do pagamento, cujo motivo esta em pagamento.motivoRecusa
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'

    AtualizacaoDeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [EM_PREPARO, PRONTO, ENTREGUE, CANCELADO]
          description: Status de destino
        motivo:
          type: string
          minLength: 3
          maxLength: 255
          description: Obrigatorio ao cancelar; ignorado nas demais transicoes

    NovoPagamento:
      type: object
      required: [metodo]
      properties:
        metodo:
          type: string
          description: DINHEIRO nao passa pelo provedor externo e fica fora desta rota
          enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO]

    Pagamento:
      type: object
      required:
        [
          pagamentoId,
          pedidoId,
          status,
          metodo,
          valor,
          referenciaExterna,
          motivoRecusa,
          pix,
          processadoEm,
          estornadoEm,
          createdAt,
        ]
      properties:
        pagamentoId:
          type: integer
          example: 17
        pedidoId:
          type: integer
          example: 9001
        status:
          type: string
          enum: [PENDENTE, APROVADO, RECUSADO, ESTORNADO]
          example: PENDENTE
        metodo:
          type: string
          enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO]
          example: PIX
        valor:
          type: string
          example: '60.15'
        referenciaExterna:
          type: string
          nullable: true
          description: Identificador do pagamento no provedor
          example: pag_0d4f8a8e-3b9e-4b8a-9f57-2f5d1f1f8b10
        motivoRecusa:
          type: string
          nullable: true
          example: null
        pix:
          type: object
          nullable: true
          required: [copiaECola]
          properties:
            copiaECola:
              type: string
              example: PIX-MOCK-3F9A0C1B2D4E5F6A7B8C9D0E
        processadoEm:
          type: string
          format: date-time
          nullable: true
          example: null
        estornadoEm:
          type: string
          format: date-time
          nullable: true
          description: Quando o provedor estornou o pagamento, no cancelamento de um pedido pago
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'

    EventoDePagamento:
      type: object
      required: [id, tipo, pagamento]
      properties:
        id:
          type: string
          example: evt_6b1f0c4e-8d2a-4f3b-9c5d-1e2f3a4b5c6d
        tipo:
          type: string
          enum: [pagamento.aprovado, pagamento.recusado]
        pagamento:
          type: object
          required: [id, referencia, valor, status, motivoRecusa, processadoEm]
          properties:
            id:
              type: string
              description: Identificador do pagamento no provedor
              example: pag_0d4f8a8e-3b9e-4b8a-9f57-2f5d1f1f8b10
            referencia:
              type: string
              description: pagamentoId nesta API, enviado na solicitacao
              example: '17'
            valor:
              type: integer
              description: Valor em centavos, conferido com o pagamento registrado
              example: 6015
            status:
              type: string
              enum: [APROVADO, RECUSADO]
            motivoRecusa:
              type: string
              nullable: true
              example: Pagamento recusado pelo emissor (simulado)
            processadoEm:
              type: string
              format: date-time

    ProgramaDeFidelidade:
      type: object
      required: [ativa, aderiuEm, saldoPontos, regras]
      properties:
        ativa:
          type: boolean
          example: true
        aderiuEm:
          type: string
          format: date-time
          nullable: true
          example: '2026-02-05T12:00:00.000Z'
        saldoPontos:
          type: integer
          example: 200
        regras:
          type: object
          required: [pontosPorReal, valorDoPonto, limiteDeDescontoPercentual]
          properties:
            pontosPorReal:
              type: integer
              example: 1
            valorDoPonto:
              type: string
              example: '0.05'
            limiteDeDescontoPercentual:
              type: integer
              example: 50

    MovimentoDeFidelidade:
      type: object
      required: [movimentoId, tipo, pontos, saldoResultante, pedidoId, descricao, createdAt]
      properties:
        movimentoId:
          type: integer
          example: 12
        tipo:
          type: string
          enum: [ACUMULO, RESGATE, EXPIRACAO, ESTORNO]
          example: ACUMULO
        pontos:
          type: integer
          description: Positivo quando entra no saldo, negativo quando sai
          example: 37
        saldoResultante:
          type: integer
          example: 237
        pedidoId:
          type: integer
          nullable: true
          example: 9001
        descricao:
          type: string
          nullable: true
          example: Pedido PED260205A1B2C3D4 entregue
        createdAt:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'

    DetalheErro:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
          example: email
        issue:
          type: string
          example: The email field must be a valid email address

    Erro:
      type: object
      required: [error, message, details, timestamp, path]
      properties:
        error:
          type: string
          description: Identificador estavel do erro
          example: DADOS_INVALIDOS
        message:
          type: string
          example: Os dados enviados nao passaram na validacao.
        details:
          type: array
          items:
            $ref: '#/components/schemas/DetalheErro'
        timestamp:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'
        path:
          type: string
          example: /api/v1/auth/signup
        requestId:
          type: string
          format: uuid
