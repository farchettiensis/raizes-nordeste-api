openapi: 3.0.3

info:
  title: API Raizes do Nordeste
  version: 0.1.0
  description: |
    API REST da rede de lanchonetes Raizes do Nordeste.

    Projeto Multidisciplinar 2026, trilha Back-End (UNINTER).

    Todas as falhas respondem com o mesmo corpo padronizado, descrito no
    schema `Erro`.

servers:
  - url: /
    description: Servidor que esta atendendo esta documentacao

tags:
  - name: Autenticacao
    description: Cadastro, login e logout
  - name: Conta
    description: Dados da conta autenticada
  - name: Unidades
    description: Unidades da rede, o cardápio e o estoque de cada uma
  - name: Pedidos
    description: Criacao de pedidos, com validacao de cardapio e estoque da unidade
  - name: Pagamentos
    description: |
      Pagamento por um provedor externo (simulado pelo servico pagamento-mock).
      A API solicita o pagamento e recebe o resultado depois, por webhook.

security:
  - bearerAuth: []

paths:
  /api/v1/auth/signup:
    post:
      tags: [Autenticacao]
      summary: Cria uma conta e devolve um token de acesso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaConta'
            example:
              fullName: Dona Francisca
              email: francisca@raizes.test
              password: Senha@123
              passwordConfirmation: Senha@123
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaAutenticacao'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/auth/login:
    post:
      tags: [Autenticacao]
      summary: Autentica o usuario e devolve um token de acesso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
            example:
              email: francisca@raizes.test
              password: Senha@123
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaAutenticacao'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/account/profile:
    get:
      tags: [Conta]
      summary: Devolve os dados da conta autenticada
      responses:
        '200':
          description: Dados da conta
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/account/logout:
    post:
      tags: [Conta]
      summary: Revoga o token de acesso em uso
      responses:
        '200':
          description: Token revogado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/unidades:
    get:
      tags: [Unidades]
      summary: Lista as unidades da rede
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: estado
          in: query
          description: Sigla da unidade federativa, com duas letras
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: PE
        - name: cidade
          in: query
          description: Trecho do nome da cidade, sem diferenciar maiúsculas
          schema:
            type: string
            example: Recife
        - name: ativa
          in: query
          description: Filtra por unidades ativas ou inativas. Sem o parâmetro, devolve todas
          schema:
            type: boolean
      responses:
        '200':
          description: Lista paginada de unidades
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Unidade'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/unidades/{id}:
    get:
      tags: [Unidades]
      summary: Devolve uma unidade da rede
      security: []
      parameters:
        - $ref: '#/components/parameters/UnidadeId'
      responses:
        '200':
          description: Dados da unidade
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Unidade'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'

  /api/v1/unidades/{id}/cardapio:
    get:
      tags: [Unidades]
      summary: Lista o cardápio de uma unidade
      description: |
        Devolve os produtos ofertados pela unidade, com o preço praticado ali.

        O campo `disponivel` combina três condições: o item estar liberado no
        cardápio da unidade, o produto estar ativo na rede e haver saldo em
        estoque naquela unidade. Um item indisponível continua aparecendo na
        listagem, para que o cliente saiba que ele existe.
      security: []
      parameters:
        - $ref: '#/components/parameters/UnidadeId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cardápio paginado, ordenado pelo nome do produto
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemDoCardapio'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/unidades/{id}/estoque:
    get:
      tags: [Unidades]
      summary: Lista o saldo de estoque de uma unidade
      description: |
        Devolve a posicao de estoque da unidade, produto a produto, com a
        quantidade em maos e a quantidade minima definida para reposicao.

        Endpoint restrito a equipe da operacao: ATENDENTE, COZINHA, GERENTE e
        ADMIN. Um CLIENTE autenticado recebe 403, porque a disponibilidade que
        interessa a ele ja aparece no cardapio publico da unidade.
      parameters:
        - $ref: '#/components/parameters/UnidadeId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saldo paginado, ordenado pelo nome do produto
          content:
            application/json:
              schema:
                type: object
                required: [data, metadata]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaldoDeEstoque'
                  metadata:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/pedidos:
    post:
      tags: [Pedidos]
      summary: Cria um pedido validando o cardapio e o estoque da unidade
      description: |
        Cria o pedido em AGUARDANDO_PAGAMENTO para o CLIENTE autenticado. O
        cliente vem do token, nunca do corpo da requisicao.

        Cada item guarda o nome e o preco praticado na unidade no momento do
        pedido, e o total e calculado no servidor. O estoque e baixado na
        criacao, com uma movimentacao de SAIDA por item vinculada ao pedido.

        Os saldos dos produtos do pedido ficam bloqueados (SELECT ... FOR
        UPDATE) durante a transacao, entao dois pedidos simultaneos pela ultima
        unidade de um produto nunca sao aceitos ao mesmo tempo: um e criado e
        o outro recebe 409.

        As verificacoes seguem esta ordem e cada uma aponta todos os itens com
        problema: unidade inexistente (404) ou inativa (409), produto fora do
        cardapio da unidade (404), produto indisponivel (409) e estoque
        insuficiente (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPedido'
            example:
              unidadeId: 1
              canalPedido: TOTEM
              itens:
                - produtoId: 1
                  quantidade: 2
                - produtoId: 5
                  quantidade: 1
      responses:
        '201':
          description: Pedido criado, aguardando pagamento
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/PedidoComRecursoInexistente'
        '409':
          $ref: '#/components/responses/PedidoEmConflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/v1/pedidos/{id}/pagamento:
    post:
      tags: [Pagamentos]
      summary: Solicita o pagamento de um pedido ao provedor externo
      description: |
        Envia o pedido ao provedor de pagamento e devolve o pagamento como
        PENDENTE, com 202: o resultado chega depois, pelo webhook do provedor,
        e e entao que o pedido vai para PAGO ou CANCELADO. Para PIX, a resposta
        traz o codigo copia e cola que o cliente usa no app do banco.

        So o CLIENTE dono do pedido pode paga-lo, e so enquanto o pedido esta
        AGUARDANDO_PAGAMENTO. O valor vem do total do pedido, nunca do corpo.
        A API nao recebe dados de cartao: a captura e feita pelo app cliente
        direto no provedor.

        Idempotente por pedido: repetir a chamada com o mesmo metodo devolve o
        mesmo pagamento, sem cobrar de novo. Se o provedor nao respondeu (503),
        repetir a chamada reenvia a mesma solicitacao com a mesma chave de
        idempotencia. Trocar o metodo com um pagamento em andamento e 409.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPagamento'
            example:
              metodo: PIX
      responses:
        '202':
          description: Pagamento solicitado, aguardando o resultado do provedor
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Pagamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissaoNoPedido'
        '404':
          $ref: '#/components/responses/PedidoNaoEncontrado'
        '409':
          $ref: '#/components/responses/PagamentoEmConflito'
        '422':
          $ref: '#/components/responses/DadosInvalidos'
        '502':
          $ref: '#/components/responses/GatewayPagamentoErro'
        '503':
          $ref: '#/components/responses/GatewayPagamentoIndisponivel'

components:
  parameters:
    Page:
      name: page
      in: query
      description: Página desejada, começando em 1
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Quantidade de itens por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    UnidadeId:
      name: id
      in: path
      required: true
      description: Identificador da unidade
      schema:
        type: integer
        example: 1
    PedidoId:
      name: id
      in: path
      required: true
      description: Identificador do pedido
      schema:
        type: integer
        example: 9001

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de acesso devolvido por signup ou login

  schemas:
    PaginationMetadata:
      type: object
      required: [total, perPage, currentPage, lastPage]
      properties:
        total:
          type: integer
          example: 4
        perPage:
          type: integer
          example: 10
        currentPage:
          type: integer
          example: 1
        lastPage:
          type: integer
          example: 1
        firstPage:
          type: integer
          example: 1
        firstPageUrl:
          type: string
          example: /?page=1
        lastPageUrl:
          type: string
          example: /?page=1
        nextPageUrl:
          type: string
          nullable: true
        previousPageUrl:
          type: string
          nullable: true

    Unidade:
      type: object
      required: [id, codigo, nome, formato, cidade, estado, endereco, ativa]
      properties:
        id:
          type: integer
          example: 1
        codigo:
          type: string
          example: REC001
        nome:
          type: string
          example: Raízes Boa Viagem
        formato:
          type: string
          enum: [COMPLETA, REDUZIDA]
          description: COMPLETA para cozinha completa, REDUZIDA para o formato enxuto
        cidade:
          type: string
          example: Recife
        estado:
          type: string
          example: PE
        endereco:
          type: string
          example: Av. Boa Viagem, 1200
        telefone:
          type: string
          nullable: true
          example: '8133334444'
        ativa:
          type: boolean
          example: true

    ItemDoCardapio:
      type: object
      required: [produtoId, codigo, nome, categoria, sazonal, preco, disponivel]
      properties:
        produtoId:
          type: integer
          example: 1
        codigo:
          type: string
          example: TAP001
        nome:
          type: string
          example: Tapioca de carne de sol com queijo coalho
        descricao:
          type: string
          nullable: true
        categoria:
          type: string
          example: TAPIOCA
        sazonal:
          type: boolean
          description: Produto ofertado apenas em determinada época do ano
          example: false
        preco:
          type: string
          description: Preço praticado nesta unidade, em reais
          example: '22.00'
        disponivel:
          type: boolean
          description: Liberado no cardápio, produto ativo e com saldo em estoque
          example: true

    SaldoDeEstoque:
      type: object
      required: [produtoId, codigo, nome, categoria, quantidade, quantidadeMinima, abaixoDoMinimo]
      properties:
        produtoId:
          type: integer
          example: 1
        codigo:
          type: string
          example: CUS001
        nome:
          type: string
          example: Cuscuz recheado de frango com catupiry
        categoria:
          type: string
          example: CUSCUZ
        quantidade:
          type: integer
          description: Saldo atual na unidade
          example: 12
        quantidadeMinima:
          type: integer
          description: Saldo a partir do qual a unidade precisa repor
          example: 2
        abaixoDoMinimo:
          type: boolean
          description: Verdadeiro quando o saldo atingiu ou passou do minimo
          example: false

    NovoPedido:
      type: object
      required: [unidadeId, canalPedido, itens]
      properties:
        unidadeId:
          type: integer
          example: 1
        canalPedido:
          type: string
          enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
          description: Canal por onde o pedido entrou
          example: TOTEM
        itens:
          type: array
          minItems: 1
          description: Cada produto aparece uma unica vez
          items:
            type: object
            required: [produtoId, quantidade]
            properties:
              produtoId:
                type: integer
                example: 1
              quantidade:
                type: integer
                minimum: 1
                maximum: 99
                example: 2
        observacoes:
          type: string
          maxLength: 500
          example: Sem cebola

    ItemDoPedido:
      type: object
      required: [produtoId, nome, quantidade, precoUnitario, subtotal]
      properties:
        produtoId:
          type: integer
          example: 1
        nome:
          type: string
          description: Nome do produto no momento do pedido
          example: Tapioca de carne de sol com queijo coalho
        quantidade:
          type: integer
          example: 2
        precoUnitario:
          type: string
          description: Preco praticado na unidade no momento do pedido
          example: '18.90'
        subtotal:
          type: string
          example: '37.80'

    Pedido:
      type: object
      required:
        [
          pedidoId,
          codigo,
          unidadeId,
          canalPedido,
          status,
          subtotal,
          desconto,
          total,
          itens,
          createdAt,
        ]
      properties:
        pedidoId:
          type: integer
          example: 9001
        codigo:
          type: string
          example: PED260205A1B2C3D4
        unidadeId:
          type: integer
          example: 1
        canalPedido:
          type: string
          enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
          example: TOTEM
        status:
          type: string
          enum: [AGUARDANDO_PAGAMENTO, PAGO, EM_PREPARO, PRONTO, ENTREGUE, CANCELADO]
          example: AGUARDANDO_PAGAMENTO
        subtotal:
          type: string
          example: '60.15'
        desconto:
          type: string
          example: '0.00'
        total:
          type: string
          example: '60.15'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemDoPedido'
        createdAt:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'

    NovoPagamento:
      type: object
      required: [metodo]
      properties:
        metodo:
          type: string
          description: DINHEIRO nao passa pelo provedor externo e fica fora desta rota
          enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO]

    Pagamento:
      type: object
      required:
        [
          pagamentoId,
          pedidoId,
          status,
          metodo,
          valor,
          referenciaExterna,
          motivoRecusa,
          pix,
          processadoEm,
          createdAt,
        ]
      properties:
        pagamentoId:
          type: integer
          example: 17
        pedidoId:
          type: integer
          example: 9001
        status:
          type: string
          enum: [PENDENTE, APROVADO, RECUSADO, ESTORNADO]
          example: PENDENTE
        metodo:
          type: string
          enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO]
          example: PIX
        valor:
          type: string
          example: '60.15'
        referenciaExterna:
          type: string
          nullable: true
          description: Identificador do pagamento no provedor
          example: pag_0d4f8a8e-3b9e-4b8a-9f57-2f5d1f1f8b10
        motivoRecusa:
          type: string
          nullable: true
          example: null
        pix:
          type: object
          nullable: true
          required: [copiaECola]
          properties:
            copiaECola:
              type: string
              example: PIX-MOCK-3F9A0C1B2D4E5F6A7B8C9D0E
        processadoEm:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'

    DetalheErro:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
          example: email
        issue:
          type: string
          example: The email field must be a valid email address

    Erro:
      type: object
      required: [error, message, details, timestamp, path]
      properties:
        error:
          type: string
          description: Identificador estavel do erro
          example: DADOS_INVALIDOS
        message:
          type: string
          example: Os dados enviados nao passaram na validacao.
        details:
          type: array
          items:
            $ref: '#/components/schemas/DetalheErro'
        timestamp:
          type: string
          format: date-time
          example: '2026-02-05T12:00:00.000Z'
        path:
          type: string
          example: /api/v1/auth/signup
        requestId:
          type: string
          format: uuid
          example: 33be9a44-6849-439c-960c-cb2d995aa732

    Usuario:
      type: object
      required: [id, fullName, email, createdAt, updatedAt, initials]
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          nullable: true
          example: Dona Francisca
        email:
          type: string
          format: email
          example: francisca@raizes.test
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        initials:
          type: string
          example: DF

    NovaConta:
      type: object
      required: [fullName, email, password, passwordConfirmation]
      properties:
        fullName:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 32
        passwordConfirmation:
          type: string
          format: password
          minLength: 8
          maxLength: 32

    Credenciais:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password

    RespostaAutenticacao:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, token]
          properties:
            user:
              $ref: '#/components/schemas/Usuario'
            token:
              type: string
              example: oat_MQ.aC1EN1BWQUZ0NFRZckctS3EyQXdab0dpZjJ5QjVXWl9pa3Jh

  responses:
    DadosInvalidos:
      description: Corpo da requisicao reprovado na validacao
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: DADOS_INVALIDOS
            message: Os dados enviados nao passaram na validacao.
            details:
              - field: email
                issue: The email field must be a valid email address
            timestamp: '2026-02-05T12:00:00.000Z'
            path: /api/v1/auth/signup
            requestId: 33be9a44-6849-439c-960c-cb2d995aa732

    CredenciaisInvalidas:
      description: E-mail ou senha invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: CREDENCIAIS_INVALIDAS
            message: E-mail ou senha invalidos.
            details: []
            timestamp: '2026-02-05T12:00:00.000Z'
            path: /api/v1/auth/login
            requestId: 09acffdd-83c7-450a-9b83-4a465790e7c0

    RecursoNaoEncontrado:
      description: O recurso solicitado não existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: RECURSO_NAO_ENCONTRADO
            message: O recurso solicitado nao foi encontrado.
            details: []
            timestamp: '2026-02-05T12:00:00.000Z'
            path: /api/v1/unidades/999
            requestId: 3e01d106-5f6e-4888-a9a5-0ab2e4e21f27

    SemPermissao:
      description: O perfil autenticado nao tem permissao para a acao
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: SEM_PERMISSAO
            message: Seu perfil nao tem permissao para esta acao.
            details: []
            timestamp: '2026-02-05T12:00:00.000Z'
