services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raizes_nordeste
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  pagamento-mock:
    build: ./pagamento-mock
    environment:
      PORT: 4000
      WEBHOOK_URL: ${PAGAMENTO_WEBHOOK_URL:-http://api:3333/api/v1/pagamentos/webhook}
      WEBHOOK_SECRET: ${PAGAMENTO_WEBHOOK_SECRET:-segredo-local-de-demonstracao}
      WEBHOOK_DELIVERIES: 2
      FAILURE_RATE: ${PAGAMENTO_FAILURE_RATE:-0}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/status || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      TZ: UTC
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: chave-local-de-demonstracao-nao-usar-em-producao
      APP_URL: http://localhost:3333
      SESSION_DRIVER: cookie
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: raizes_nordeste
      PAGAMENTO_GATEWAY_URL: http://pagamento-mock:4000
      PAGAMENTO_WEBHOOK_SECRET: ${PAGAMENTO_WEBHOOK_SECRET:-segredo-local-de-demonstracao}
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy
      pagamento-mock:
        condition: service_healthy

volumes:
  postgres-data:
